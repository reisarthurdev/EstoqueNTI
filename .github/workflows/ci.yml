name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: O CSS compilado está em dia?
        run: |
          npm run build:css
          git diff --exit-code -- public/styles.css || (echo "Rode 'npm run build:css' e faça commit do public/styles.css" && exit 1)

      - name: Checar sintaxe dos arquivos JS
        run: find src scripts public -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Criar .env de teste
        run: |
          cat > .env <<'EOF'
          DB_ROOT_PASSWORD=root-ci-12345
          DB_APP_PASSWORD=app-ci-12345
          JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret
          ADMIN_EMAIL=admin@nti.local
          ADMIN_PASSWORD=SenhaCI12345
          EOF

      - name: Subir a stack (app + MySQL + migração)
        run: docker compose up -d --build

      - name: Teste de fumaça (health, login, painel)
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 3
          done
          curl -fsS http://localhost:3000/api/health
          curl -fsS -c jar -H 'Content-Type: application/json' \
            -d '{"email":"admin@nti.local","password":"SenhaCI12345"}' http://localhost:3000/api/auth/login
          curl -fsS -b jar http://localhost:3000/api/dashboard

      - name: Logs (se falhou)
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar
        if: always()
        run: docker compose down -v
